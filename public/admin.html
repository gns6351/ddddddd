<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연구자 대시보드</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="wrap wide">
    <div class="head">
      <h1>연구자 대시보드</h1>
      <span class="muted" id="meta"></span>
    </div>

    <div class="card" id="login" hidden>
      <label class="q" for="token">관리자 비밀번호 (.env의 ADMIN_TOKEN)</label>
      <div class="row">
        <input type="text" id="token" autocomplete="off">
        <button type="button" id="load">열기</button>
      </div>
    </div>
    <div class="error left" id="err"></div>

    <div class="toolbar no-print" id="toolbar" hidden>
      <label>AI 모드
        <select id="f-mode"><option value="all">전체</option><option value="live">실제 호출만</option><option value="mock">모의만</option></select>
      </label>
      <label>캐릭터
        <select id="f-character"><option value="all">전체</option></select>
      </label>
      <label class="inline"><input type="checkbox" id="f-live" checked> 15초마다 새로고침</label>
      <button type="button" class="secondary small" id="refresh">지금 새로고침</button>
      <span class="muted" id="updated"></span>
    </div>

    <nav class="tabs no-print" id="tabs" hidden>
      <button type="button" data-tab="analysis" class="on">통계</button>
      <button type="button" data-tab="sessions">세션 기록</button>
      <button type="button" data-tab="exports">내보내기</button>
    </nav>

    <section id="analysis" data-pane="analysis"></section>

    <section id="sessions" data-pane="sessions" hidden>
      <div class="scroll"><table class="data" id="list"></table></div>
      <div id="detail"></div>
    </section>

    <section id="exports" data-pane="exports" hidden>
      <div class="panel">
        <h3>내려받기</h3>
        <p class="lead">위 필터(AI 모드·캐릭터)가 그대로 적용됩니다.</p>
        <div class="actions left">
          <button type="button" data-dl="/api/admin/export.csv">세션 CSV (엑셀·SPSS·R)</button>
          <button type="button" class="secondary" data-dl="/api/admin/export.json">전체 기록 JSON</button>
          <button type="button" class="secondary" id="report">통계 보고서 (HTML)</button>
        </div>
        <p class="note">CSV는 한 사람당 한 행입니다. 설문 문항 중 보여 주지 않은 문항은 NA로 표시됩니다. 보고서는 브라우저에서 열어 PDF로 인쇄할 수 있습니다.</p>
      </div>
      <div class="panel">
        <h3>현재 설정</h3>
        <div id="settings"></div>
      </div>
    </section>
  </main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="admin.js" type="module"></script>
</body>
</html>
